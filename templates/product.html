<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product['name'] }} | Подробное описание</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f0f6;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(74, 44, 90, 0.08);
            overflow: hidden;
            display: flex;
            flex-wrap: wrap; 
        }
        .image-section {
            flex: 1;
            min-width: 300px;
            background-color: #faf8fb;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        .info-section {
            flex: 1;
            min-width: 300px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .back-link {
            color: #9b59b6;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1 {
            color: #4a2c5a;
            margin: 0 0 15px 0;
            font-size: 2rem;
        }
        .price {
            font-size: 1.8rem;
            color: #8e44ad;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .description-title {
            font-weight: 600;
            color: #7f8c8d;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .description-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #555;
            margin: 0 0 30px 0;
        }
        .buy-btn {
            display: block;
            text-align: center;
            background-color: #4a2c5a;
            color: white;
            padding: 15px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background-color 0.2s;
        }
        .buy-btn:hover {
            background-color: #3b2247;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-section">
            <img class="product-image" src="{{ product['image_url'] }}" alt="{{ product['name'] }}">
        </div>
        
        <div class="info-section">
            <a href="/" class="back-link">← Назад в каталог</a>
            <h1>{{ product['name'] }}</h1>
            <div class="price">{{ product['price'] }} ₸</div>
            
            <div class="description-title">Описание товара</div>
            <p class="description-text">{{ product['description'] }}</p>
            
            <a href="#" class="buy-btn" onclick="alert('Товар добавлен в корзину (функционал в разработке)')">Купить</a>
        </div>
    </div>

</body>
</html>
