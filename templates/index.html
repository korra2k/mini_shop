<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Маркет | Каталог</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f0f6; 
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #4a2c5a; 
            margin-bottom: 30px;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(74, 44, 90, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(74, 44, 90, 0.15);
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: contain; 
            background-color: #faf8fb;
            padding: 10px;
            box-sizing: border-box;
        }
        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .product-title {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            color: #4a2c5a;
            font-weight: 600;
        }
        .product-price {
            font-size: 1.2rem;
            color: #8e44ad; 
            font-weight: bold;
            margin-bottom: 15px;
        }
        .details-btn {
            display: block;
            text-align: center;
            background-color: #9b59b6; 
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 6px;
            margin-top: auto;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .details-btn:hover {
            background-color: #8e44ad;
        }
    </style>
</head>
<body>

    <h1>Каталог товаров</h1>

    <div class="catalog-grid">
        {% for product in products %}
        <div class="product-card">
            <img class="product-image" src="{{ product['image_url'] }}" alt="{{ product['name'] }}">
            <div class="product-info">
                <h2 class="product-title">{{ product['name'] }}</h2>
                <div class="product-price">{{ product['price'] }} ₸</div>
                <a href="/product/{{ product['id'] }}" class="details-btn">Подробнее</a>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
